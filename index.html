/* ============================================================
   Storage
   On a phone or in a normal browser: IndexedDB, which has room
   for photos. If that is blocked: localStorage. Inside Claude:
   the artifact storage. Memory as a last resort.
   Everything saves automatically — there is no Save button.
============================================================ */
const KEY='househq3', PKEY=id=>'hqphoto:'+id;
const timeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timed out')),ms))]);

const idb={
  db:null,
  open(){
    return new Promise((res,rej)=>{
      let req;
      try{ req=indexedDB.open('househq',1); }catch(e){ return rej(e); }
      req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); };
      req.onsuccess=()=>{ this.db=req.result; this.db.onversionchange=()=>{ this.db.close(); this.db=null; }; res(); };
      req.onerror=()=>rej(req.error||new Error('could not open the database'));
      req.onblocked=()=>rej(new Error('database blocked'));
    });
  },
  tx(mode,fn){
    return new Promise((res,rej)=>{
      if(!this.db) return rej(new Error('database closed'));
      let out;
      const tx=this.db.transaction('kv',mode);
      tx.oncomplete=()=>res(out);
      tx.onerror=()=>rej(tx.error||new Error('transaction failed'));
      tx.onabort=()=>rej(tx.error||new Error('transaction aborted'));
      const r=fn(tx.objectStore('kv'));
      if(r) r.onsuccess=()=>{ out=r.result; };
    });
  },
  get(k){ return this.tx('readonly',s=>s.get(k)).then(v=>v===undefined?null:v); },
  set(k,v){ return this.tx('readwrite',s=>s.put(v,k)).then(()=>true); },
  del(k){ return this.tx('readwrite',s=>s.delete(k)).then(()=>true); }
};

const mem={};
const store={
  mode:'memory',
  async init(){
    // Inside Claude the artifact storage is the only thing that persists.
    if(window.storage && typeof window.storage.get==='function'){ this.mode='artifact'; return; }
    try{
      await timeout(idb.open(),4000);
      await timeout(idb.set('__probe__','1'),4000);
      await idb.del('__probe__');
      this.mode='idb';
      await this.migrateFromLocal();
      if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
      return;
    }catch(e){}
    try{ localStorage.setItem('__probe__','1'); localStorage.removeItem('__probe__'); this.mode='local'; return; }
    catch(e){}
    this.mode='memory';
  },
  // An earlier version kept its data in localStorage. Carry it over once.
  async migrateFromLocal(){
    try{
      if(await idb.get(KEY)) return;
      const raw=localStorage.getItem(KEY); if(!raw) return;
      await idb.set(KEY,raw);
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k && k.startsWith('hqphoto:')){ const v=localStorage.getItem(k); if(v) await idb.set(k,v); }
      }
    }catch(e){}
  },
  async get(k){
    if(this.mode==='idb'){ try{ return await idb.get(k); }catch(e){ return null; } }
    if(this.mode==='artifact'){ try{ const r=await timeout(window.storage.get(k,false),8000); return r?r.value:null; }catch(e){ return null; } }
    if(this.mode==='local'){ return localStorage.getItem(k); }
    return mem[k]??null;
  },
  async set(k,v){
    if(this.mode==='idb'){ try{ return await idb.set(k,v); }catch(e){ return false; } }
    if(this.mode==='artifact'){
      for(let attempt=0;attempt<2;attempt++){
        try{ const r=await timeout(window.storage.set(k,v,false),8000); if(r!==null&&r!==undefined) return true; }catch(e){}
        await new Promise(r=>setTimeout(r,400));
      }
      return false;
    }
    if(this.mode==='local'){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
    mem[k]=v; return true;
  },
  async del(k){
    if(this.mode==='idb'){ try{ return await idb.del(k); }catch(e){ return false; } }
    if(this.mode==='artifact'){ try{ await window.storage.delete(k,false); return true; }catch(e){ return false; } }
    if(this.mode==='local'){ localStorage.removeItem(k); return true; }
    delete mem[k]; return true;
  },
  saving(){ return this.mode!=='memory'; }
};

/* ---------- saving ---------- */
const SAVE_FAIL='Could not save just now. Download a backup from the House tab to be safe.';
let saveTimer=null, savePending=false;
async function save(){
  clearTimeout(saveTimer); saveTimer=null; savePending=false;
  const ok=await store.set(KEY,JSON.stringify(S));
  if(!ok) setNote(SAVE_FAIL);
  else if(noteMsg===SAVE_FAIL) setNote('');
  cloud.push();
  return ok;
}
// Typing saves on a short delay so every keystroke is not a write.
function saveSoon(){ savePending=true; clearTimeout(saveTimer); saveTimer=setTimeout(save,250); }
function flushSave(){ if(savePending) save(); }
window.addEventListener('pagehide',flushSave);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushSave(); });

function setNote(m,kind){ noteMsg=m; noteKind=kind||''; document.getElementById('note').innerHTML =
  m?`<div class="note ${noteKind}">${esc(m)}${noteKind==='undo'
      ?`<button class="undobtn" data-act="undo">Undo</button>`
      :`<button class="icb" style="margin-left:auto" data-act="clearnote" aria-label="Dismiss">${I.x}</button>`}</div>`:''; }

/* Deleting is one tap; an Undo bar gives ten seconds to take it back. */
let undoCur=null, undoTimer=null;
function deleted(what,undo,finalize){
  clearTimeout(undoTimer);
  const my={undo,finalize}; undoCur=my;
  setNote('Deleted '+what+'.','undo');
  undoTimer=setTimeout(()=>{ if(undoCur===my){ undoCur=null; if(my.finalize) my.finalize(); if(noteKind==='undo') setNote(''); } },10000);
  render(); save();
}

async function decode(file){
  if(window.createImageBitmap){
    try{ return await createImageBitmap(file); }catch(e){}
  }
  const url=await new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=()=>rej(new Error('could not read the file'));
    r.readAsDataURL(file);
  });
  return await new Promise((res,rej)=>{
    const i=new Image();
    i.onload=()=>res(i);
    i.onerror=()=>rej(new Error('could not decode the image'));
    i.src=url;
  });
}
async function compress(file,maxDim,quality){
  const src=await decode(file);
  const w=src.width, h=src.height;
  if(!w||!h) throw new Error('image had no dimensions');
  const sc=Math.min(1,maxDim/Math.max(w,h));
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*sc));
  c.height=Math.max(1,Math.round(h*sc));
  const ctx=c.getContext('2d');
  if(!ctx) throw new Error('no canvas support');
  ctx.drawImage(src,0,0,c.width,c.height);
  if(src.close) src.close();
  const out=c.toDataURL('image/jpeg',quality);
  if(!out || out.length<100) throw new Error('canvas produced nothing');
  return out;
}

function fbReady(ms){
  return new Promise(res=>{
    const go=()=>timeout(window.loadFB(),ms).then(res,()=>res(null));

function sortCol(col,arr){
  const o=x=>x._o??0;
  if(col==='logs') return arr.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||o(b)-o(a));
  if(col==='photos') return arr.sort((a,b)=>(b.addedAt||'').localeCompare(a.addedAt||'')||o(b)-o(a));
  return arr.sort((a,b)=>o(a)-o(b));

function friendlyErr(e){
  const c=(e&&(e.code||e.message)||'')+'';
  if(/permission-denied/.test(c)) return 'Firestore is refusing access. Check the security rules from the setup steps.';
  if(/operation-not-allowed|admin-restricted/.test(c)) return 'Anonymous sign-in is not switched on in Firebase Authentication.';
  if(/api-key|invalid-api-key|project/.test(c)) return 'The Firebase config does not look right.';
  if(/unavailable|network|offline|Failed to fetch/.test(c)) return 'No connection right now.';
  return (e&&e.message)||'something went wrong';
}
/* What changed locally since the last sync, as Firestore writes. */
function diffState(cur,prev){
  const ops=[]; const first=!prev;
  for(const c of SHARED_COLS){
    const a=cur[c]||[], b=prev?(prev[c]||[]):[];
    const bm=new Map(b.map(x=>[x.id,JSON.stringify(x)])), seen=new Set();
    a.forEach((x,i)=>{
      if(x._o==null) x._o=first?i:Date.now()+i;
      seen.add(x.id);
      if(bm.get(x.id)!==JSON.stringify(x)) ops.push({col:c,id:x.id,data:clone(x)});
    });
    for(const id of bm.keys()) if(!seen.has(id)) ops.push({col:c,id,data:null});
  }
  for(const m of CHECK_MAPS){
    const a=cur[m]||{}, b=prev?(prev[m]||{}):{};
    for(const k in a) if(!b[k]) ops.push({col:m,id:k,data:{v:1}});
    for(const k in b) if(!a[k]) ops.push({col:m,id:k,data:null});
  }
  const meta={}; let mc=false;
  for(const f of META_FIELDS){
    const av=cur[f]===undefined?null:cur[f], bv=prev?(prev[f]===undefined?null:prev[f]):undefined;
    if(JSON.stringify(av)!==JSON.stringify(bv)){ meta[f]=av; mc=true; }
  }
  return {ops,meta:mc?meta:null};
}
function applyToSynced(ls,op){
  if(CHECK_MAPS.includes(op.col)){ ls[op.col]=ls[op.col]||{}; if(op.data) ls[op.col][op.id]=1; else delete ls[op.col][op.id]; return; }
  const arr=ls[op.col]=ls[op.col]||[]; const i=arr.findIndex(x=>x.id===op.id);
  if(op.data){ if(i>=0) arr[i]=op.data; else arr.push(op.data); } else if(i>=0) arr.splice(i,1);
}
function emptyShell(base){
  const s={...(base||{}),photoData:{}};
  for(const c of SHARED_COLS) s[c]=[];
  for(const m of CHECK_MAPS) s[m]={};
  s.closedPhases={};
  return s;
}

const cloud={

  onCol(col,docs){

      const server=new Set(docs.map(d=>d.id)), prev=new Set(Object.keys(ls[col]||{})), local=S[col]||{}, out={};
      for(const k of server){ if(!(k in local)&&prev.has(k)) continue; out[k]=local[k]||1; }

      const server=new Map(docs.map(d=>[d.id,d.data]));
      const prev=new Map((ls[col]||[]).map(x=>[x.id,JSON.stringify(x)]));
      const local=new Map((S[col]||[]).map(x=>[x.id,x])), out=[];
      for(const [id,sd] of server){

      }
      for(const [id,l] of local) if(!server.has(id)&&!prev.has(id)) out.push(l);

  },
  onMeta(data){

      const pending=JSON.stringify(S[f]===undefined?null:S[f])!==JSON.stringify(ls[f]===undefined?null:ls[f]);

  afterPull(){

const yearKey=(id,y)=>id+':'+y;
const isClosed=p=>!!(S.closedPhases&&S.closedPhases[p]);
const activePhases=()=>PHASES.filter(p=>!isClosed(p));
const visibleTasks=()=>S.tasks.filter(t=>!isClosed(t.when));
// The setup checklist is a one-time job. Once every stage that has items is closed out, its tab goes away.
const setupOpen=()=>S.tasks.some(t=>!isClosed(t.when));
const closedList=()=>Object.keys(S.closedPhases||{}).filter(p=>S.tasks.some(t=>t.when===p));
/* "Every 3 years" style items are only due in the year they come round. */
function freqInfo(freq){
  const f=(freq||'').toLowerCase(); let m;
  if((m=f.match(/every\s+(\d+)\s*(year|yr)/))) return {years:+m[1]};
  if(/every other year|biennial/.test(f)) return {years:2};
  if((m=f.match(/every\s+(\d+)\s*month/))) return {months:+m[1]};
  if(/quarter/.test(f)) return {months:3};
  if(/month/.test(f)) return {months:1};
  if(/week/.test(f)) return {weeks:1};
  return {years:1};
}
function lastDoneBefore(id,y){
  const ys=Object.keys(S.yearlyDone).filter(k=>k.startsWith(id+':')).map(k=>+k.split(':').pop()).filter(v=>v<y);
  return ys.length?Math.max(...ys):null;
}
function nextDueYear(x,y){
  const fi=freqInfo(x.freq); if(!fi.years||fi.years<2) return null;
  const last=lastDoneBefore(x.id,y); return last?last+fi.years:null;
}
const dueInYear=(x,y)=>{ if(S.yearlyDone[yearKey(x.id,y)]) return true; const n=nextDueYear(x,y); return n===null||n<=y; };
const seasonalDone=y=>S.yearly.filter(x=>S.yearlyDone[yearKey(x.id,y)]).length;
const seasonalTotal=y=>S.yearly.filter(x=>dueInYear(x,y)).length;
function completePhases(){
  return activePhases().filter(p=>{
    const r=S.tasks.filter(t=>t.when===p);
    return r.length && r.every(t=>t.done);
  });
}
function yearsTouched(){
  const set=new Set([S.activeYear,new Date().getFullYear()]);
  Object.keys(S.yearlyDone).forEach(k=>set.add(+k.split(':').pop()));
  Object.keys(S.equipDone).forEach(k=>set.add(+k.split(':').pop()));
  return [...set].sort((a,b)=>a-b);
}
function lastDoneYear(id){
  const ys=Object.keys(S.yearlyDone).filter(k=>k.startsWith(id+':')).map(k=>+k.split(':').pop());
  return ys.length?Math.max(...ys):null;
}

.seasons button{flex:1;display:grid;justify-items:center;gap:1px;font:700 14px ${HEAD};letter-spacing:.03em;

h2.sec{font:700 22px/1.15 ${HEAD};margin:28px 0 8px;display:flex;align-items:baseline;gap:9px}

.row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid ${t.rule}}

.btn{background:${t.paper};border:1.5px solid ${t.rule};border-radius:10px;padding:11px 12px;font-size:15px;

.btn.solid{background:${t.accent};color:${t.onAccent};border-color:${t.accent};
  font:700 17px ${HEAD};letter-spacing:.02em;padding:13px}
.btn.dark{background:${t.ink};color:${t.paper};border-color:${t.ink}}
.btn.danger{color:${t.warn};border-color:${t.warnSoft};background:${t.warnSoft}}

.editbtn{width:auto;flex:0 0 auto;padding:0 14px}
.editbtn.on{background:${t.accentSoft};border-color:${t.accent};color:${t.accent}}

.btns{display:grid;gap:8px;margin-top:10px}
.btns.h{grid-auto-flow:column;grid-auto-columns:1fr}
.icb{background:none;border:0;color:${t.ink70};padding:6px;line-height:0;border-radius:8px;

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}

.tag{border-radius:6px;padding:2px 8px;font:600 12.5px ${HEAD};white-space:nowrap;background:${t.accentSoft};color:${t.accent}}

.strip{display:flex;gap:8px;overflow-x:auto;padding:6px 0}

.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbtn{display:flex;align-items:center;gap:10px;background:${t.paper};color:${t.ink};
  border:1.5px solid ${t.rule};border-radius:10px;padding:11px 12px;font-weight:600;text-align:left;min-height:46px}

.box.soft{background:${t.goodSoft};border-color:${t.goodSoft};color:${t.good}}

.bar{height:8px;border-radius:4px;background:${t.rule};overflow:hidden;width:100%}

.prow{align-items:flex-start}
.thumb{width:76px;height:76px;flex:0 0 76px;border:1px solid ${t.rule};border-radius:10px;background:${t.ground};

@media (prefers-reduced-motion:reduce){*{transition:none!important}}`;


function applyTheme(){
  const t=THEMES[S.theme]||THEMES.concrete;
  document.getElementById('sty').textContent=CSS(t);
  for(const k in t) if(k!=='label') document.documentElement.style.setProperty('--'+k,t[k]);
  const cs = S.theme==='midnight' ? 'dark' : 'light';
  document.documentElement.style.colorScheme=cs;
  const m=document.querySelector('meta[name="color-scheme"]');
  if(m) m.content=cs;
  const tc=document.getElementById('themecolor');
  if(tc) tc.content=t.paper;
}

function renderHeader(){
  const setup=setupOpen();
  let done,total;
  if(setup){ const vis=visibleTasks(); done=vis.filter(t=>t.done).length; total=vis.length; }
  else { done=seasonalDone(S.activeYear); total=seasonalTotal(S.activeYear); }
  document.getElementById('hname').textContent=S.propertyName||'House HQ';
  const tabLabel=(TABS.find(([k])=>k===tab)||[])[1]||'';
  document.getElementById('hsub').textContent=tabLabel;
  document.getElementById('hdone').textContent=done;
  document.getElementById('htotal').textContent='of '+total;
  const ticks=Math.max(Math.min(total,58),1), fill=Math.round(done/Math.max(total,1)*ticks);
  document.getElementById('gauge').innerHTML=Array.from({length:ticks},(_,i)=>
    `<i class="${i<fill?'on':''}" style="height:${i%5===0?22:12}px"></i>`).join('');
  const cur=currentSeason(), y=S.activeYear;
  document.getElementById('seasons').innerHTML=tab!=='seasons'?'':SEASONS.map(([n])=>{
    const rows=S.yearly.filter(x=>x.season===n&&dueInYear(x,y)), d=rows.filter(x=>S.yearlyDone[yearKey(x.id,y)]).length;
    return `<button class="${n===seasonSel?'on':''} ${n===cur?'now':''}" data-act="pickseason" data-v="${n}" aria-pressed="${n===seasonSel}">${n}<small>${rows.length?d+'/'+rows.length:'—'}</small></button>`;
  }).join('');
}

function checkbox(on,act,data){
  return `<button class="box ${on?'on':''}" data-act="${act}" ${data} aria-label="toggle">${on?I.check:''}</button>`;
}
function stripHTML(ids){
  if(!ids||!ids.length) return '';
  return `<div class="strip">${ids.map(id=>{
    const src=photoCache[id];
    return `<button data-act="viewphoto" data-id="${id}">${src?`<img src="${src}" alt="">`:I.img}</button>`;
  }).join('')}</div>`;
}
function logHTML(logs,showSubject){
  if(!logs.length) return '';
  return `<div class="log">${logs.map(l=>`<div class="e">
    <div class="d">${esc(l.date)}${l.who?`<em>${esc(l.who)}</em>`:''}
      <button class="icb" style="margin-left:auto" data-act="dellog" data-id="${l.id}">${I.trash}</button></div>
    ${showSubject?`<div class="w"><b>${esc(l.subject)}</b></div>`:''}
    ${l.what?`<div class="w">${esc(l.what)}</div>`:''}
    ${(l.cost||l.doc)?`<div class="meta">${l.cost?'$'+esc(l.cost):''}${l.cost&&l.doc?' · ':''}${l.doc?esc(l.doc):''}</div>`:''}
    ${stripHTML(l.photos)}</div>`).join('')}</div>`;
}

/* ---------- All items ---------- */
function viewList(){
  const rows=visibleTasks().filter(t=>{
    const okP=filter==='All'||t.when===filter;
    const ql=q.trim().toLowerCase();
    return okP && (!ql||(t.title+t.cat+t.notes).toLowerCase().includes(ql));
  });
  const groups={}; rows.forEach(t=>(groups[t.when]=groups[t.when]||[]).push(t));

  const ready=completePhases();
  let banner='';
  if(ready.length){
    banner=`<div class="banner">
      <b>${ready.length===1?esc(ready[0])+' is fully checked.':'Some stages are fully checked.'}</b>
      <p>Close a stage out and it drops off the list and the filters. Bring it back any time from the House tab.</p>
      <div class="btns">${ready.map(p=>
        `<button class="btn" data-act="closeout" data-v="${esc(p)}">${I.check} Close out ${esc(p)}</button>`).join('')}</div>
    </div>`;
  }

  return `${banner}
  <div style="display:flex;gap:8px;margin-bottom:10px">
    <input id="q" placeholder="Search items" value="${esc(q)}">
    <button class="btn dark" style="width:50px;flex:0 0 50px;padding:0" data-act="newtask" aria-label="Add an item">${I.plus}</button>
    <button class="btn editbtn ${editing?'on':''}" data-act="edit">${editing?'Done':'Edit'}</button>
  </div>
  <button class="btn dash" style="margin-bottom:14px" data-act="snap">${I.cam} Snap something to look at later</button>
  <div class="chips">${['All',...activePhases()].map(p=>
    `<button class="chip ${filter===p?'on':''}" data-act="filter" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>
  ${rows.length?'':'<p class="hint">Nothing matches. Clear the search, or add it as a new item.</p>'}
  ${activePhases().filter(p=>groups[p]).map(p=>`
    <section class="grp"><h3>${esc(p)}<span>${groups[p].filter(t=>!t.done).length} open</span></h3>
    ${groups[p].map(t=>`<div class="row ${t.done?'done':''}">
      ${checkbox(t.done,'toggletask','data-id="'+t.id+'"')}
      <button class="body" data-act="detail" data-id="${t.id}">
        <div class="t">${esc(t.title||'Untitled')}</div>
        <div class="m">${esc(t.cat)}${t.photos&&t.photos.length?`<span>${I.cam} ${t.photos.length}</span>`:''}${S.logs.some(l=>l.refId===t.id)?`<span>${I.doc} logged</span>`:''}</div>
      </button>
      ${editing?`<button class="icb" data-act="edittask" data-id="${t.id}" aria-label="Edit">${I.pencil}</button>
      <button class="icb" data-act="deltask" data-id="${t.id}" aria-label="Remove">${I.trash}</button>`:''}
    </div>`).join('')}</section>`).join('')}`;
}

/* ---------- Seasons ---------- */
function viewSeasons(){
  const y=S.activeYear, years=yearsTouched(), now=new Date().getFullYear();
  const isCurrent=y===now, doneN=seasonalDone(y), totalN=seasonalTotal(y), cur=currentSeason();
  const order=(x,ms)=>x.month?ms.indexOf(+x.month):99;
  const nowM=new Date().getMonth()+1;

  // What needs doing right now, across all seasons
  let due='';
  if(isCurrent){
    const open=S.yearly.filter(x=>dueInYear(x,y)&&!S.yearlyDone[yearKey(x.id,y)]);
    const dueNow=open.filter(x=>x.month?+x.month===nowM:x.season===cur);
    const slipped=open.filter(x=>x.month&&+x.month<nowM);
    due=`<div class="card"><div class="head" style="cursor:default;padding-bottom:6px"><b>Due now</b><i>${MONTHS[nowM-1]}</i></div>
      <div class="inner" style="padding-top:0">
      ${dueNow.length?dueNow.map(x=>yearRow(x,y,true)).join(''):'<p class="hint" style="margin:6px 0 4px">Nothing due this month.</p>'}
      ${slipped.length?`<button class="btn" style="margin-top:10px;border-style:dashed" data-act="slipped">${slippedOpen?I.x:I.right} ${slipped.length} from earlier this year${slippedOpen?'':' still open'}</button>
        ${slippedOpen?slipped.map(x=>yearRow(x,y,true)).join(''):''}`:''}
      </div></div>`;
  }

  return `<div style="display:flex;gap:8px;margin-bottom:12px;align-items:stretch">
    <div class="yearbar" style="flex:1;margin:0">
      <button data-act="year" data-v="${y-1}" ${y-1<Math.min(...years)?'disabled':''} aria-label="Previous year">${I.left}</button>
      <div style="text-align:center"><b>${y}</b><small>${doneN} of ${totalN} done${isCurrent?'':' in a past year'}</small></div>
      <button data-act="year" data-v="${y+1}" ${y+1>now?'disabled':''} aria-label="Next year">${I.right}</button>
    </div>
    <button class="btn editbtn ${editing?'on':''}" data-act="edit">${editing?'Done':'Edit'}</button>
  </div>
  ${isCurrent?'':`<p class="hint">A past year. What you checked then stays as a record.</p>`}
  ${due}
  ${(()=>{
    const [name,ms,range]=SEASONS.find(([n])=>n===seasonSel)||SEASONS[0];
    const rows=S.yearly.filter(x=>x.season===name).sort((a,b)=>order(a,ms)-order(b,ms));
    const isNow=name===cur&&isCurrent;
    return `<section class="grp"><h3>${name}<span>${range}${isNow?' — now':''}</span></h3>
      ${rows.map(x=>yearRow(x,y,false)).join('')}
      ${rows.length?'':`<p class="hint" style="margin:8px 0">Nothing in ${name} yet.</p>`}
      <button class="btn dash" style="margin-top:10px" data-act="newyear" data-v="${name}">${I.plus} Add an item to ${name}</button>
    </section>`;
  })()}
  ${isCurrent?'':`<div class="btns" style="margin-top:24px"><button class="btn dark" data-act="year" data-v="${now}">Back to ${now}</button></div>`}
  <button class="btn" style="margin-top:16px" data-act="calendar">${I.cal} Put this list in my phone's calendar</button>
  <p class="hint" style="margin-top:12px">Pick a season at the top. Every January the boxes clear and the same list comes back; the arrows step back through past years.</p>`;
}
function yearRow(x,y,showSeason){
  const on=!!S.yearlyDone[yearKey(x.id,y)], next=nextDueYear(x,y), notDue=!on&&next!==null&&next>y;
  const last=lastDoneBefore(x.id,y);
  const meta=notDue
    ? [`done ${last}`,`next due ${next}`]
    : [showSeason?x.season:'',x.cat,x.freq,x.month?MONTHS[x.month-1]:'',last&&!on?'last done '+last:''];
  return `<div class="row ${on?'done':''} ${notDue?'notdue':''}">
    ${notDue?`<button class="box on soft" data-act="toggleyear" data-id="${x.id}" aria-label="Mark done again this year">${I.check}</button>`
            :checkbox(on,'toggleyear','data-id="'+x.id+'"')}
    <button class="body" data-act="yeardetail" data-id="${x.id}">
      <div class="t">${esc(x.title)}</div>
      <div class="m">${meta.filter(Boolean).map(esc).join(' · ')}${S.logs.some(l=>l.refId===x.id)?`<span>${I.doc} logged</span>`:''}</div>
    </button>
    ${editing?`<button class="icb" data-act="edityear" data-id="${x.id}" aria-label="Edit">${I.pencil}</button>
    <button class="icb" data-act="delyear" data-id="${x.id}" aria-label="Remove">${I.trash}</button>`:''}
  </div>`;
}

/* ---------- Photos ---------- */
function viewPhotos(){
  const groups=photoGroups();
  const places=groups.filter(g=>g.key).map(g=>g.name);
  const top=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
    <h2 class="sec" style="margin:0;flex:1">Photo log${S.photos.length?` <em>${S.photos.length}</em>`:''}</h2>
    ${S.photos.length?`<button class="btn editbtn ${editing?'on':''}" data-act="edit">${editing?'Done':'Edit'}</button>`:''}
  </div>`;
  if(!S.photos.length) return top+`
    <p class="hint">Nothing yet. Photograph anything you want to compare later — a crack, a serial plate, a wet spot, an invoice — then give it a spot on the property so its history stays together.</p>
    <button class="btn solid" data-act="snapfree">${I.cam} Take a photo</button>`;
  return top+`
  <button class="btn solid" data-act="snapfree" style="margin-bottom:16px">${I.cam} Take a photo</button>
  <datalist id="places">${places.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
  ${groups.map(g=>`<section class="grp">

/* Photos grouped by the spot they were taken, newest spot first; unlabelled ones on top so they get named. */
function photoGroups(){
  const map=new Map();
  for(const p of S.photos){
    const key=(p.where||'').trim().toLowerCase();
    if(!map.has(key)) map.set(key,{key,name:(p.where||'').trim(),photos:[]});
    map.get(key).photos.push(p);
  }
  const gs=[...map.values()];
  gs.sort((a,b)=>(a.key?1:0)-(b.key?1:0)||(b.photos[0].addedAt>a.photos[0].addedAt?1:-1));
  return gs;
}
function photosAt(key){ return S.photos.filter(p=>(p.where||'').trim().toLowerCase()===key).slice().reverse(); } // oldest first
function fmtDate(s){
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); if(!m) return s||'';
  return `${MONTHS[+m[2]-1].slice(0,3)} ${+m[3]}, ${m[1]}`;
}

/* ---------- Budget ---------- */
const num=v=>{ const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; };
const money=n=>'$'+(Math.round(n*100)/100).toLocaleString(undefined,{maximumFractionDigits:2});
const yearOf=d=>+String(d||'').slice(0,4);
function lineSpent(l,y){
  const e=(l.entries||[]).filter(x=>yearOf(x.date)===y).reduce((s,x)=>s+num(x.amount),0);
  const b=(S.buy||[]).filter(x=>x.lineId===l.id&&x.bought&&yearOf(x.bought)===y).reduce((s,x)=>s+num(x.paid||x.est),0);
  return e+b;
}
const logSpent=y=>S.logs.filter(l=>yearOf(l.date)===y).reduce((s,l)=>s+num(l.cost),0);
const unassignedBuys=y=>(S.buy||[]).filter(x=>!x.lineId&&x.bought&&yearOf(x.bought)===y).reduce((s,x)=>s+num(x.paid||x.est),0);
function budgetYears(){
  const set=new Set(yearsTouched());
  (S.budget||[]).forEach(l=>(l.entries||[]).forEach(e=>set.add(yearOf(e.date))));
  (S.buy||[]).forEach(b=>{ if(b.bought) set.add(yearOf(b.bought)); });
  return [...set].filter(Boolean).sort((a,b)=>a-b);
}
function bar(spent,planned){
  const pct=planned>0?Math.min(100,Math.round(spent/planned*100)):0, over=planned>0&&spent>planned;
  return `<div class="bar"><i style="width:${pct}%" class="${over?'over':''}"></i></div>`;
}
function viewBudget(){
  const y=S.activeYear, now=new Date().getFullYear(), years=budgetYears();
  const lines=S.budget||[], buys=S.buy||[];
  const planned=lines.reduce((s,l)=>s+num(l.planned),0);
  const fromLogs=logSpent(y), loose=unassignedBuys(y);
  const spent=lines.reduce((s,l)=>s+lineSpent(l,y),0)+fromLogs+loose;
  const open=buys.filter(b=>!b.bought), got=buys.filter(b=>b.bought&&yearOf(b.bought)===y);
  const buyRow=b=>`<div class="row ${b.bought?'done':''}">
      ${checkbox(!!b.bought,'togglebuy','data-id="'+b.id+'"')}
      <button class="body" data-act="buyedit" data-id="${b.id}">
        <div class="t">${esc(b.title)}</div>
        <div class="m">${[b.bought?'bought '+fmtDate(b.bought):'',num(b.paid||b.est)?money(num(b.paid||b.est)):'',(lines.find(l=>l.id===b.lineId)||{}).name,b.note].filter(Boolean).map(esc).join(' · ')}</div>
      </button>
      ${editing?`<button class="icb" data-act="delbuy" data-id="${b.id}" aria-label="Remove">${I.trash}</button>`:''}
    </div>`;
  return `<div style="display:flex;gap:8px;margin-bottom:12px;align-items:stretch">
    <div class="yearbar" style="flex:1;margin:0">
      <button data-act="year" data-v="${y-1}" ${y-1<Math.min(...years)?'disabled':''} aria-label="Previous year">${I.left}</button>
      <div style="text-align:center"><b>${y}</b><small>${money(spent)} of ${money(planned)}</small></div>
      <button data-act="year" data-v="${y+1}" ${y+1>now?'disabled':''} aria-label="Next year">${I.right}</button>
    </div>
    <button class="btn editbtn ${editing?'on':''}" data-act="edit">${editing?'Done':'Edit'}</button>
  </div>
  <div class="card"><div class="inner" style="padding-top:14px">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><b class="cond" style="font-size:22px">${money(spent)} spent</b><span class="hint" style="margin:0">${planned?money(Math.max(0,planned-spent))+' left':'no plan yet'}</span></div>
    ${bar(spent,planned)}
    ${planned&&spent>planned?`<p class="hint" style="margin:6px 0 0;color:var(--warn)">${money(spent-planned)} over the plan.</p>`:''}
  </div></div>

  <section class="grp"><h3>Budget lines<span>planned per year</span></h3>
    ${lines.map(l=>{ const sp=lineSpent(l,y), pl=num(l.planned); return `<div class="row" style="flex-direction:column;gap:6px">
      <div style="display:flex;gap:10px;align-items:center">
        <button class="body" data-act="line" data-id="${l.id}"><div class="t">${esc(l.name)}</div>
          <div class="m">${money(sp)}${pl?' of '+money(pl):''}</div></button>
        ${editing?`<button class="icb" data-act="lineedit" data-id="${l.id}" aria-label="Edit">${I.pencil}</button>
        <button class="icb" data-act="delline" data-id="${l.id}" aria-label="Remove">${I.trash}</button>`:''}
      </div>${bar(sp,pl)}</div>`; }).join('')}
    ${fromLogs?`<div class="row" style="flex-direction:column;gap:6px"><div><div class="t" style="color:var(--ink70)">From service records</div><div class="m">${money(fromLogs)} · costs entered on records this year</div></div></div>`:''}
    ${loose?`<div class="row" style="flex-direction:column;gap:6px"><div><div class="t" style="color:var(--ink70)">Purchases not on a line</div><div class="m">${money(loose)}</div></div></div>`:''}
    <button class="btn dash" style="margin-top:10px" data-act="newline">${I.plus} Add a budget line</button>
  </section>

  <section class="grp"><h3>Things to buy<span>${open.length?money(open.reduce((s,b)=>s+num(b.est),0))+' to go':'nothing waiting'}</span></h3>
    ${open.map(buyRow).join('')}
    ${open.length?'':'<p class="hint" style="margin:8px 0">Nothing on the list.</p>'}
    <button class="btn dash" style="margin-top:10px" data-act="newbuy">${I.plus} Add something to buy</button>
    ${got.length?`<h4 style="margin:18px 0 4px;font:700 15px ${'Barlow Condensed'},sans-serif;color:var(--ink70)">Bought in ${y}</h4>${got.map(buyRow).join('')}`:''}
  </section>
  <p class="hint" style="margin-top:12px">Planned amounts are per year. Spending comes from what you add on each line, from purchases you tick off, and from any cost you put on a service record.</p>`;
}

function render(){

      <input data-m="note" value="${esc(d.note)}" placeholder="What was it">
      <button class="btn solid" data-act="done">Done</button>`,true);

  if(modal.kind==='buyedit'){
    const d=modal.draft;

      <input data-m="title" value="${esc(d.title)}" placeholder="What to buy">
      <div style="display:flex;gap:8px">
        <label class="lbl" style="flex:1">Est. price<input data-m="est" value="${esc(d.est)}" inputmode="decimal" placeholder="0"></label>
        <label class="lbl" style="flex:1">Budget line<select data-m="lineId"><option value="">None</option>${(S.budget||[]).map(l=>`<option value="${l.id}" ${d.lineId===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label>
      </div>
      <input data-m="note" value="${esc(d.note)}" placeholder="Store, size, model, why">
      <input data-m="url" value="${esc(d.url)}" placeholder="Link" inputmode="url">
      ${d.bought?`<div style="display:flex;gap:8px">

      </div>`:''}
      ${d.url?`<a class="btn" href="${esc(d.url)}" target="_blank" rel="noopener">Open the link</a>`:''}
      <button class="btn ${d.bought?'':'solid'}" data-act="togglebuy" data-id="${d.id}">${d.bought?'Mark as not bought':I.check+' Mark as bought'}</button>
      <button class="btn ${d.bought?'solid':''}" data-act="done">Done</button>`,true);
  }
  if(modal.kind==='paste'){
    return sheet('Restore from pasted text',`

  if(modal.kind==='calendar'){

      <p class="hint" style="margin:0">${modal.count} repeating events, one per seasonal item, each with a 9 AM reminder on the first of its month. On an iPhone the file opens straight into Calendar; on Android, open it with Google Calendar.</p>

  if(modal.kind==='compare'){

    return `<div class="viewer cmp" data-act="scrim">${pane('a')}${pane('b')}
      <button class="icb cmpx" data-act="closemodal" aria-label="Close">${I.x}</button></div>`;
  }
  if(modal.kind==='photo'){
    return `<div class="viewer" data-act="scrim"><img src="${photoCache[modal.id]||''}" alt=""></div>`;
  }
  return '';
}
function sheet(title,inner,auto){
  return `<div class="scrim" data-act="scrim"><div class="sheet">
    <div class="top"><div><h3>${esc(title)}</h3>${auto?'<div class="auto">Saves as you type</div>':''}</div>
      <button class="icb" data-act="closemodal" aria-label="Close">${I.x}</button></div>
    <div class="fields">${inner}</div></div></div>`;
}

/* Sheets save as you type. A brand-new item is created as soon as it has something in it. */
function commitDraft(){
  if(!modal||!modal.draft) return;
  const d=modal.draft;
  if(modal.kind==='task'){
    const has=(d.title||'').trim()||(d.notes||'').trim()||(d.photos&&d.photos.length);
    const rec={...d,photos:[...(d.photos||[])]};
    const i=S.tasks.findIndex(x=>x.id===d.id);
    if(i>=0) S.tasks[i]=rec; else if(has) S.tasks.push(rec); else return;
  }else if(modal.kind==='yearitem'){
    if(!(d.title||'').trim()) return;
    const rec={...d,month:+d.month||0,season:d.season||seasonOf(+d.month||1)};
    const i=S.yearly.findIndex(x=>x.id===d.id);
    if(i>=0) S.yearly[i]=rec; else S.yearly.push(rec);
  }else if(modal.kind==='lineedit'){
    if(!(d.name||'').trim()) return;
    const i=S.budget.findIndex(x=>x.id===d.id);
    if(i>=0) S.budget[i]={...S.budget[i],name:d.name,planned:num(d.planned)};
    else S.budget.push({id:d.id,name:d.name,planned:num(d.planned),entries:[]});
  }else if(modal.kind==='spend'){
    if(!(num(d.amount)>0)) return;
    const l=S.budget.find(x=>x.id===d.lineId); if(!l) return;
    l.entries=l.entries||[];
    const rec={id:d.id,date:d.date,amount:num(d.amount),note:d.note||''};
    const i=l.entries.findIndex(e=>e.id===d.id);
    if(i>=0) l.entries[i]=rec; else l.entries.push(rec);
  }else if(modal.kind==='buyedit'){
    if(!(d.title||'').trim()) return;
    const rec={id:d.id,title:d.title,est:num(d.est),note:d.note||'',url:d.url||'',lineId:d.lineId||'',bought:d.bought||null,paid:num(d.paid)};
    const i=S.buy.findIndex(x=>x.id===d.id);
    if(i>=0) S.buy[i]={...S.buy[i],...rec}; else S.buy.push(rec);
  }else if(modal.kind==='log'){
    const has=(d.what||'').trim()||(d.who||'').trim()||(d.cost||'').trim()||(d.doc||'').trim()||(d.photos&&d.photos.length);
    const rec={id:d.id,refId:d.refId,subject:d.subject,what:d.what,who:d.who,cost:d.cost,doc:d.doc,
      photos:[...(d.photos||[])],date:((d.date||'')+' '+(d.time||'')).trim()};
    const i=S.logs.findIndex(x=>x.id===d.id);
    if(i>=0) S.logs[i]=rec; else if(has) S.logs.unshift(rec); else return;
  }else return;
  saveSoon();
}
function closeModal(){
  if(modal&&modal.draft){
    commitDraft();
    if(modal.kind==='yearitem'&&(modal.draft.title||'').trim()) seasonSel=modal.draft.season;
  }
  modal=null; flushSave();
  if(pendingRender){ pendingRender=false; }
}

document.addEventListener('input',async e=>{
  const el=e.target, a=el.dataset.act;
  if(el.id==='q'){ q=el.value; const p=el.selectionStart; render();
    const n=document.getElementById('q'); if(n){n.focus();n.setSelectionRange(p,p);} return; }
  if(el.dataset.m && modal){
    if(modal.draft){
      modal.draft[el.dataset.m]=el.value;
      if(el.dataset.m==='season'){ if(!seasonMonths(el.value).includes(+modal.draft.month)) modal.draft.month=0; commitDraft(); render(); return; }
      commitDraft();
    } else modal[el.dataset.m]=el.value;
    return; }
  if(!a) return;
  if(a==='pname'){ S.propertyName=el.value; document.getElementById('hname').textContent=el.value||'House HQ'; saveSoon(); return; }
  if(a==='spec'){ const s=S.specs.find(x=>x.id===el.dataset.sid); s[el.dataset.f]=el.value; saveSoon(); return; }
  if(a==='eq'){ const q2=S.equipment.find(x=>x.id===el.dataset.id); q2[el.dataset.f]=el.value; saveSoon(); return; }
  if(a==='espec'){ const q2=S.equipment.find(x=>x.id===el.dataset.id);
    q2.specs.find(x=>x.id===el.dataset.sid)[el.dataset.f]=el.value; saveSoon(); return; }
  if(a==='echk'){ const q2=S.equipment.find(x=>x.id===el.dataset.id);
    q2.checks.find(x=>x.id===el.dataset.cid)[el.dataset.f]=el.value; saveSoon(); return; }
  if(a==='nc'){ draftContact[el.dataset.f]=el.value; return; }
  if(a==='caption'||a==='where'){ const p=S.photos.find(x=>x.id===el.dataset.id);
    p[a==='caption'?'caption':'where']=el.value; saveSoon(); return; }
});

document.addEventListener('click',async e=>{
  const btn=e.target.closest('[data-act]');
  if(!btn) return;
  const a=btn.dataset.act, id=btn.dataset.id, v=btn.dataset.v;

  if(a==='scrim'){
    if(Date.now()-modalAt<600) return;            // ignore the ghost click that follows opening
    if(e.target===btn){ closeModal(); render(); }
    return; }
  if(a==='closemodal'||a==='done'){ const back=modal&&modal.back; closeModal();
    if(back){ modalAt=Date.now(); modal=back; } render(); return; }
  if(a==='undo'){ if(undoCur){ const u=undoCur; undoCur=null; clearTimeout(undoTimer); u.undo(); } setNote(''); render(); save(); return; }
  if(a==='slipped'){ slippedOpen=!slippedOpen; render(); return; }
  if(a==='compare'){ const list=photosAt(v); if(list.length<2) return; await loadPhotos(list.map(p=>p.id));
    modalAt=Date.now(); modal={kind:'compare',key:v,a:0,b:list.length-1}; render(); return; }
  if(a==='cmpstep'){ const list=photosAt(modal.key), side=btn.dataset.side, n=modal[side]+(+btn.dataset.d);
    if(n>=0&&n<list.length){ modal[side]=n; render(); } return; }
  if(a==='calendar'){ openCalendarSheet(); return; }
  if(a==='calshare'){ const f=icsFile(modal.text);
    try{ await navigator.share({files:[f],title:'House HQ calendar'}); modal=null; render(); }
    catch(e){ if(e&&e.name!=='AbortError') setNote('Sharing did not work here. Save the file or copy the text instead.'); }
    return; }
  if(a==='caldl'){ if(!saveFile(modal.text,'house-hq.ics','text/calendar')) setNote('This browser blocked the download. Copy the text instead.'); return; }
  if(a==='calcopy'){ const t=modal.text;
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>setNote('Calendar text copied.','ok'),()=>selectText('ics'));
    else selectText('ics');
    return; }
  if(a==='clearnote'){ setNote(''); return; }
  if(a==='tab'){ tab=v; editing=false; closeModal(); render(); return; }
  if(a==='edit'){ editing=!editing; render(); return; }
  if(a==='filter'){ filter=v; render(); return; }
  if(a==='pickseason'){ seasonSel=v; render(); return; }
  if(a==='equip'){ openEquip=openEquip===id?null:id; render(); return; }
  if(a==='theme'){ S.theme=v; LS('hq:theme',v); render(); save(); return; }
  if(a==='year'){ const yr=+v; if(yr>new Date().getFullYear()) return; S.activeYear=yr; render(); save(); return; }

  if(a==='toggletask'){ const t=S.tasks.find(x=>x.id===id);
    t.done=!t.done; t.doneAt=t.done?Date.now():null; render(); save(); return; }
  if(a==='toggleyear'){ const k=yearKey(id,S.activeYear);
    if(S.yearlyDone[k]) delete S.yearlyDone[k]; else S.yearlyDone[k]=Date.now(); render(); save(); return; }
  if(a==='toggleequip'){ const k=id+':'+btn.dataset.cid+':'+S.activeYear;
    if(S.equipDone[k]) delete S.equipDone[k]; else S.equipDone[k]=Date.now(); render(); save(); return; }

  if(a==='newtask'){ modalAt=Date.now(), modal={kind:'task',draft:{id:uid(),cat:'',title:'',when:'First month',contact:'',url:'',notes:'',cost:'',done:false,doneAt:null,photos:[]},isNew:true}; render(); return; }
  if(a==='edittask'){ modalAt=Date.now(), modal={kind:'task',draft:{...S.tasks.find(x=>x.id===id)}}; render(); return; }
  if(a==='detail'){ modalAt=Date.now(), modal={kind:'detail',id}; render(); return; }
  if(a==='deltask'){ const i=S.tasks.findIndex(x=>x.id===id); if(i<0) return;
    const [t]=S.tasks.splice(i,1);
    deleted('\u201c'+(t.title||'Untitled')+'\u201d',()=>S.tasks.splice(i,0,t)); return; }

  if(a==='newyear'){ modalAt=Date.now(); modal={kind:'yearitem',isNew:true,
    draft:{id:uid(),season:v,month:0,title:'',cat:'',freq:'Annual',notes:''}}; render(); return; }
  if(a==='edityear'){ const back=modal&&modal.kind==='yeardetail'?{kind:'yeardetail',id:modal.id}:null;
    modalAt=Date.now(); modal={kind:'yearitem',back,draft:{...S.yearly.find(x=>x.id===id)}}; render(); return; }
  if(a==='yeardetail'){ modalAt=Date.now(); modal={kind:'yeardetail',id}; render(); return; }
  if(a==='delyear'){ const i=S.yearly.findIndex(z=>z.id===id); if(i<0) return;
    const [x]=S.yearly.splice(i,1), keep={};
    Object.keys(S.yearlyDone).forEach(k=>{ if(k.startsWith(id+':')){ keep[k]=S.yearlyDone[k]; delete S.yearlyDone[k]; } });
    if(modal&&modal.kind==='yeardetail'&&modal.id===id) modal=null;
    deleted('\u201c'+x.title+'\u201d',()=>{ S.yearly.splice(i,0,x); Object.assign(S.yearlyDone,keep); }); return; }
  if(a==='log'){ const now=new Date();
    modalAt=Date.now(), modal={kind:'log',draft:{id:uid(),refId:id,subject:btn.dataset.sub||'',date:now.toISOString().slice(0,10),
      time:now.toTimeString().slice(0,5),what:'',who:'',cost:'',doc:'',photos:[]}}; render(); return; }
  if(a==='dellog'){ const i=S.logs.findIndex(l=>l.id===id); if(i<0) return;
    const [l]=S.logs.splice(i,1); deleted('the record from '+l.date,()=>S.logs.splice(i,0,l)); return; }

  if(a==='snap'){ pick(async f=>{
      const pid=await addPhoto(f,{caption:'',where:''});
      if(pid){ modalAt=Date.now(); modal={kind:'task',isNew:true,draft:{id:uid(),cat:'Watch',title:'',when:'Watch',contact:'',url:'',notes:'',cost:'',done:false,doneAt:null,photos:[pid]}}; commitDraft(); }
      render();
    }); return; }
  if(a==='snapfree'){ pick(async f=>{ await addPhoto(f,{caption:'',where:''}); render(); }); return; }
  if(a==='mphoto'){ pick(async f=>{
      const pid=await addPhoto(f,{caption:modal.draft.title||modal.draft.subject||'',where:''});
      if(pid && modal && modal.draft){ modal.draft.photos.push(pid); commitDraft(); }
      render();
    }); return; }
  if(a==='viewphoto'){ await loadPhotos([id]); modalAt=Date.now(); modal={kind:'photo',id}; render(); return; }
  if(a==='delphoto'){ const i=S.photos.findIndex(p=>p.id===id); if(i<0) return;
    const [ph]=S.photos.splice(i,1), data=photoCache[id], inline=S.photoData&&S.photoData[id];
    const refs=[];
    [...S.tasks,...S.logs].forEach(o=>{ const j=(o.photos||[]).indexOf(id); if(j>=0){ refs.push([o,j]); o.photos.splice(j,1); } });
    if(S.photoData) delete S.photoData[id];
    delete photoCache[id];
    deleted('the photo'+(ph.caption?' \u201c'+ph.caption+'\u201d':''),
      ()=>{ S.photos.splice(i,0,ph); refs.forEach(([o,j])=>o.photos.splice(j,0,id)); photoCache[id]=data; if(inline) S.photoData[id]=inline; },
      ()=>{ store.del(PKEY(id)); cloud.deletePhoto(id); });
    return; }

  if(a==='closeout'){ S.closedPhases[v]=new Date().toISOString().slice(0,10);
    if(filter===v) filter='All';
    if(!setupOpen()){ tab='seasons'; editing=false; setNote('Setup finished. The seasonal list is home now; the old list is on the House tab if you ever need it.','ok'); }
    render(); save(); return; }
  if(a==='reopenphase'){ delete S.closedPhases[v]; render(); save(); return; }
  if(a==='reopenall'){ S.closedPhases={}; tab='list'; filter='All'; render(); save(); return; }

  if(a==='addspec'){ S.specs.push({id:uid(),k:'',v:''}); render(); save(); return; }
  if(a==='delspec'){ S.specs=S.specs.filter(x=>x.id!==btn.dataset.sid); render(); save(); return; }
  if(a==='addespec'){ S.equipment.find(x=>x.id===id).specs.push({id:uid(),k:'',v:''}); render(); save(); return; }
  if(a==='delespec'){ const q2=S.equipment.find(x=>x.id===id);
    q2.specs=q2.specs.filter(x=>x.id!==btn.dataset.sid); render(); save(); return; }
  if(a==='addechk'){ S.equipment.find(x=>x.id===id).checks.push({id:uid(),title:'New check',freq:'Annual'}); render(); save(); return; }
  if(a==='delechk'){ const q2=S.equipment.find(x=>x.id===id);
    q2.checks=q2.checks.filter(x=>x.id!==btn.dataset.cid); render(); save(); return; }
  if(a==='addequip'){ const e2={id:uid(),name:'New equipment',make:'',model:'',serial:'',specs:[],checks:[]};
    S.equipment.push(e2); openEquip=e2.id; render(); save(); return; }
  if(a==='delequip'){ const i=S.equipment.findIndex(x=>x.id===id); if(i<0) return;
    const [e2]=S.equipment.splice(i,1); deleted(e2.name,()=>S.equipment.splice(i,0,e2)); return; }

  if(a==='savecontact'){
    if(!draftContact.name.trim() && !draftContact.phone.trim()){ setNote('Give the contact a name or a number first.'); return; }
    S.contacts.push({id:uid(),...draftContact});
    draftContact={name:'',role:'',phone:''};
    render(); save(); return; }
  if(a==='delcontact'){ const i=S.contacts.findIndex(c=>c.id===id); if(i<0) return;
    const [c]=S.contacts.splice(i,1); deleted(c.name||'the contact',()=>S.contacts.splice(i,0,c)); return; }

  if(a==='backup'){ await backup(); return; }
  if(a==='dlfile'){ if(saveFile(modal.text,`househq-${new Date().toISOString().slice(0,10)}.json`,'application/json')) markBackedUp();
    else setNote('This browser blocked the download. Copy the text instead.'); return; }
  if(a==='copybackup'){
    const t=modal.text;
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>{ setNote('Backup copied.','ok'); markBackedUp(); },()=>selectText('bkp'));
    else selectText('bkp');
    return; }
  if(a==='pickbackup'){ pickBackupFile(); return; }
  if(a==='pasterestore'){ modalAt=Date.now(); modal={kind:'paste'}; render(); return; }
  if(a==='line'){ modalAt=Date.now(); modal={kind:'line',id}; render(); return; }
  if(a==='newline'){ modalAt=Date.now(); modal={kind:'lineedit',isNew:true,draft:{id:uid(),name:'',planned:''}}; render(); return; }
  if(a==='lineedit'){ const l=S.budget.find(x=>x.id===id); const back=modal&&modal.kind==='line'?{kind:'line',id:modal.id}:null;
    modalAt=Date.now(); modal={kind:'lineedit',back,draft:{id:l.id,name:l.name,planned:l.planned||''}}; render(); return; }
  if(a==='delline'){ const i=S.budget.findIndex(x=>x.id===id); if(i<0) return;
    const [l]=S.budget.splice(i,1); deleted('\u201c'+l.name+'\u201d',()=>S.budget.splice(i,0,l)); return; }
  if(a==='newspend'){ const back=modal&&modal.kind==='line'?{kind:'line',id:modal.id}:null;
    modalAt=Date.now(); modal={kind:'spend',back,draft:{id:uid(),lineId:id,amount:'',date:new Date().toISOString().slice(0,10),note:''}}; render(); return; }
  if(a==='delspend'){ const l=S.budget.find(x=>x.id===btn.dataset.line); if(!l) return;
    const i=(l.entries||[]).findIndex(e=>e.id===id); if(i<0) return;
    const [e]=l.entries.splice(i,1); deleted(money(num(e.amount))+' from '+l.name,()=>l.entries.splice(i,0,e)); return; }
  if(a==='newbuy'){ modalAt=Date.now(); modal={kind:'buyedit',isNew:true,draft:{id:uid(),title:'',est:'',note:'',url:'',lineId:'',bought:null,paid:''}}; render(); return; }
  if(a==='buyedit'){ const b=S.buy.find(x=>x.id===id); modalAt=Date.now(); modal={kind:'buyedit',draft:{...b,est:b.est||'',paid:b.paid||''}}; render(); return; }
  if(a==='togglebuy'){
    const b=S.buy.find(x=>x.id===id);
    const flip=o=>{ if(o.bought){ o.bought=null; } else { o.bought=new Date().toISOString().slice(0,10); if(!num(o.paid)) o.paid=num(o.est); } };
    if(modal&&modal.kind==='buyedit'&&modal.draft.id===id){ flip(modal.draft); commitDraft(); render(); return; }
    if(!b) return; flip(b); render(); save(); return; }
  if(a==='delbuy'){ const i=S.buy.findIndex(x=>x.id===id); if(i<0) return;
    const [b]=S.buy.splice(i,1); deleted('\u201c'+b.title+'\u201d',()=>S.buy.splice(i,0,b)); return; }
  if(a==='connect'){ modalAt=Date.now(); modal={kind:'connect',code:cloud.code||''}; render(); return; }
  if(a==='nocloud'){ LS('hq:nocloud','1'); closeModal(); render(); return; }
  if(a==='doconnect'){
    const code=(modal.code||'').trim().toLowerCase();
    if(!/^[a-z0-9][a-z0-9-]{7,}$/.test(code)){ modal.joinNote='The code needs at least eight characters: letters, numbers and dashes only.'; render(); return; }
    if(!cloud.hasConfig()){
      const cfg=cloud.parseConfig(modal.cfg||'');
      if(!cfg){ modal.joinNote='That config is missing apiKey, projectId or appId. Paste the whole block from the console.'; render(); return; }
      cloud.config=cfg; LS('hq:fbconfig',JSON.stringify(cfg));
    }
    if(cloud.status==='on'||cloud.status==='error') await cloud.disconnect();
    cloud.code=code; LS('hq:house',code); LS('hq:nocloud',null);
    modal=null; tab='house'; render(); cloud.connect(); return; }
  if(a==='reconnect'){ cloud.status='off'; cloud.connect(); return; }
  if(a==='disconnect'){ await cloud.disconnect(); setNote('Sharing stopped on this phone. Your copy is still here.','ok'); render(); return; }
  if(a==='copycode'){ if(navigator.clipboard) navigator.clipboard.writeText(cloud.code).then(()=>setNote('House code copied.','ok'),()=>setNote(cloud.code)); else setNote(cloud.code); return; }
  if(a==='dopaste'){ const t=(document.getElementById('pst')||{}).value||''; if(!t.trim()){ setNote('Nothing pasted yet.'); return; } await applyRestore(t.trim()); return; }
});

/* ---------- backup / restore / export ---------- */
async function backup(){
  const photos={};
  for(const p of S.photos){ const d=photoCache[p.id]??(S.photoData&&S.photoData[p.id])??await store.get(PKEY(p.id)); if(d) photos[p.id]=d; }
  const text=JSON.stringify({app:'househq',v:3,state:S,photos},null,1);
  modalAt=Date.now(), modal={kind:'backup',text}; render();
}
function markBackedUp(){ S.lastBackup=new Date().toISOString(); save(); if(tab==='house'&&!modal) render(); }
function saveFile(text,name,type){
  try{
    const blob=new Blob([text],{type});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=name;
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },3000);
    return true;
  }catch(e){ return false; }
}
/* Bring any older save up to the current shape. */
function normalize(){
  if(!S.photos) S.photos=[];
  if(!S.photoData) S.photoData={};
  if(!S.yearly) S.yearly=[];
  if(!S.yearlyDone) S.yearlyDone={};
  if(!S.equipDone) S.equipDone={};
  if(!S.closedPhases){
    S.closedPhases={};
    if(S.closingDone) S.closedPhases['Before closing']=new Date().toISOString().slice(0,10);
    delete S.closingDone;
  }
  // The seasonal list starts fresh every January on its own; past years stay browsable.
  S.activeYear=new Date().getFullYear();
  S.yearly.forEach(x=>{ if(!x.season) x.season=seasonOf(x.month||1); if(x.month===undefined||x.month===null) x.month=0; });
  if(!S.createdAt) S.createdAt=new Date().toISOString();
  if(!S.budget) S.budget=budgetSeed();
  if(!S.buy) S.buy=[];
  S.v=6;
}
/* A gentle reminder to back up: after two weeks with none, then every two months. Snoozes two weeks once shown. */
function backupNudge(){
  if(!store.saving()||noteMsg) return;
  const day=864e5, now=Date.now();
  const last=S.lastBackup?Date.parse(S.lastBackup):null;
  const age=(now-(last||Date.parse(S.createdAt)))/day;
  const since=S.backupNagAt?(now-Date.parse(S.backupNagAt))/day:99;
  if(age>=(last?60:14)&&since>=14){
    S.backupNagAt=new Date().toISOString(); save();
    setNote(last?`It has been ${Math.round(age)} days since your last backup. Grab one from the House tab.`:'No backup yet. Grab one from the House tab when you get a minute.');
  }
}
async function applyRestore(text){
  try{
    const data=JSON.parse(text);
    if(!data.state) throw 0;
    S=data.state; normalize();
    if(!setupOpen()) tab='seasons';
    if(data.photos) for(const id in data.photos){ photoCache[id]=data.photos[id]; await store.set(PKEY(id),data.photos[id]); cloud.photoWritten(id,data.photos[id]); }
    modal=null; render(); save(); setNote('');
  }catch(err){ setNote('That did not look like a House HQ backup.'); }
}
function pickBackupFile(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json,text/plain';
  inp.onchange=async()=>{ const f=inp.files[0]; if(f) await applyRestore(await f.text()); };
  inp.click();
}
function selectText(elId){
  const ta=document.getElementById(elId);
  if(ta){ ta.focus(); ta.select(); setNote('Copy was blocked. The text is selected, so use your copy button.'); }
}
/* ---------- calendar export ---------- */
const icsText=v=>String(v??'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
const icsLine=l=>(l.match(/[\s\S]{1,60}/g)||['']).join('\r\n ');
function buildICS(){
  const now=new Date(), thisY=now.getFullYear(), thisM=now.getMonth()+1;
  const stamp=now.toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const pad=n=>String(n).padStart(2,'0');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//House HQ//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:House HQ'];
  let count=0;
  for(const x of S.yearly){
    if(!(x.title||'').trim()) continue;
    const month=+x.month||seasonMonths(x.season)[0]||1;
    const fi=freqInfo(x.freq);
    let year=month>=thisM?thisY:thisY+1;
    if(fi.years>1){ const last=lastDoneBefore(x.id,thisY+1); if(last&&last+fi.years>year) year=last+fi.years; }
    const rule=fi.months?`FREQ=MONTHLY;INTERVAL=${fi.months}`:fi.weeks?'FREQ=WEEKLY':`FREQ=YEARLY${fi.years>1?';INTERVAL='+fi.years:''}`;
    const d=`${year}${pad(month)}01`, dEnd=`${month===12?year+1:year}${pad(month===12?1:month+1)}01`;
    const desc=[x.cat,x.freq,x.notes].filter(Boolean).join(' — ');
    L.push('BEGIN:VEVENT',`UID:${x.id}@househq`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${dEnd}`,`RRULE:${rule}`,
      icsLine(`SUMMARY:${icsText(x.title)}`),icsLine(`DESCRIPTION:${icsText(desc)}`),
      'BEGIN:VALARM','ACTION:DISPLAY',icsLine(`DESCRIPTION:${icsText(x.title)}`),'TRIGGER:PT9H','END:VALARM','END:VEVENT');
    count++;
  }
  L.push('END:VCALENDAR');
  return {text:L.join('\r\n')+'\r\n',count};
}
function icsFile(text){ try{ return new File([text],'house-hq.ics',{type:'text/calendar'}); }catch(e){ return null; } }
function openCalendarSheet(){
  const {text,count}=buildICS();
  const f=icsFile(text);
  const canShare=!!(f&&navigator.canShare&&navigator.canShare({files:[f]}));
  modalAt=Date.now(); modal={kind:'calendar',text,count,canShare}; render();
}


/* ============================================================
   Boot
============================================================ */
(async()=>{
  await store.init();
  const raw=await store.get(KEY);
  try{ S=raw?JSON.parse(raw):seed(); }catch(e){ S=seed(); }
  normalize();
  const lt=LS('hq:theme'); if(lt&&THEMES[lt]) S.theme=lt;
  if(!setupOpen()) tab='seasons';
  if(!store.saving()) setNote('This browser is not letting the app save. Download a backup before you close it.');
  render();
  await cloud.init();
  if(!cloud.code&&!LS('hq:nocloud')&&location.protocol==='https:'){ modalAt=Date.now(); modal={kind:'connect',code:''}; render(); }
  backupNudge();
  if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
